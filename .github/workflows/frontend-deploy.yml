name: Frontend Deploy (Manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build

    - name: Sync dist/ to OVH via SSH
      uses: easingthemes/ssh-deploy@v4
      env:
        SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_KEY }}
        REMOTE_HOST: ${{ secrets.OVH_HOST }}
        REMOTE_USER: ${{ secrets.OVH_USER }}
        SOURCE: "dist/"
        TARGET: "/srv/ra-avm-test/frontend/dist"
        ARGS: "-avz --delete"

    - name: Reload Caddy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.OVH_HOST }}
        username: ${{ secrets.OVH_USER }}
        key: ${{ secrets.OVH_SSH_KEY }}
        script: sudo systemctl reload caddy
