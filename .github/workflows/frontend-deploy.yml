name: Frontend Deploy (Manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    # -------------------------------
    # Restore SSH key from Base64
    # -------------------------------
    - name: Restore SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.OVH_SSH_KEY_B64 }}" | base64 --decode > ~/.ssh/ovh_ci_key
        chmod 600 ~/.ssh/ovh_ci_key

    # -------------------------------
    # Set up Node
    # -------------------------------
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # -------------------------------
    # Install dependencies
    # -------------------------------
    - name: Install dependencies
      run: npm ci

    # -------------------------------
    # Build frontend
    # -------------------------------
    - name: Build frontend
      run: npm run build

    # -------------------------------
    # Sync dist/ → OVH via rsync/SSH
    # -------------------------------
    - name: Sync dist to OVH
      run: |
        rsync -avz --delete \
          -e "ssh -i ~/.ssh/ovh_ci_key -o StrictHostKeyChecking=no" \
          dist/ \
          "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}:/srv/ra-avm-test/frontend/dist"

    # -------------------------------
    # Reload Caddy on OVH
    # -------------------------------
    - name: Reload Caddy
      run: |
        ssh -i ~/.ssh/ovh_ci_key -o StrictHostKeyChecking=no \
          ${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }} \
          "sudo systemctl reload caddy"
